# Supabase 免费版保活：免费项目连续 7 天数据库活动不足会被自动暂停。
# 本任务每 12 小时向 REST API 发起一次极轻量查询，保持数据库活跃。
# 文档：https://supabase.com/docs/guides/platform/free-project-pausing
name: supabase-keepalive

on:
  schedule:
    # 每天 UTC 00:23 / 12:23（北京时间 08:23 / 20:23），避开整点拥堵
    - cron: "23 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST to keep project active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/positions?select=id&limit=1")
          echo "HTTP ${code}"
          cat /tmp/resp.json
          test "${code}" = "200"
